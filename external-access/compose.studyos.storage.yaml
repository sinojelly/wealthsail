# Optional NAS storage overlay; append after StudyOS's base and access overlay.
# The /app/data target replaces the base file's ./volume bind by target identity.
services:
  studyos:
    volumes:
      - type: bind
        source: ${NAS_VOLUME_STUDY_OS:?Set NAS_VOLUME_STUDY_OS to the existing NAS data root}
        target: /app/data
        bind:
          create_host_path: false

volumes:
  codex-runtime:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${NAS_VOLUME_CODEX:?Set NAS_VOLUME_CODEX to the existing private Codex root}/studyos/runtime
