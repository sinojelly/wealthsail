# The public TLS edge is the only intended caller of this loopback-bound
# container. Accept only a single canonical protocol token from that edge;
# malformed, appended or missing values fall back to this hop's scheme.
log_format wealthsail_timing 'web_request time=$time_iso8601 request_id=$request_id '
    'method=$request_method path=$uri status=$status request_time=$request_time '
    'upstream_time=$upstream_response_time upstream_header_time=$upstream_header_time '
    'bytes=$body_bytes_sent encoding=$sent_http_content_encoding';

map $http_x_forwarded_proto $wealthsail_forwarded_proto {
    default $scheme;
    ~*^https$ https;
    ~*^http$ http;
}

server {
    listen 80;
    server_name _;
    access_log /dev/stdout wealthsail_timing;

    root /usr/share/nginx/html;
    index index.html;

    # Defense-in-depth headers. HSTS becomes effective at the external TLS edge.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # SSE must bypass Nginx response buffering so each event reaches the browser
    # as soon as the API emits it.
    location = /api/v1/chat/stream {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $wealthsail_forwarded_proto;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Accel-Buffering "no" always;
    }

    location /api/ {
        # Large JSON reports should not dominate page load on a slow uplink.
        # The exact SSE location above stays outside this compression scope.
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 3;
        gzip_min_length 1024;
        gzip_types application/json;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $wealthsail_forwarded_proto;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    # Avatar capability URLs are random, persisted in a dedicated volume and
    # never handled by SPA fallback. They are user-specific, so do not use a
    # public immutable cache.
    location ~ "^/static/avatars/[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}_[0-9]{10}_[0-9a-f]{32}\.webp$" {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $wealthsail_forwarded_proto;
        add_header Cache-Control "private, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /static/avatars/ {
        return 404;
    }

    # A browser reloading after a deployment must receive the current entry
    # bundle. `expires -1` emits Cache-Control: no-cache without overriding the
    # security headers inherited from the server block.
    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    # Hashed Vite assets are immutable, but a missing asset is never an SPA
    # route. Returning index.html for a .js request produces a text/html MIME
    # error and prevents stale-build recovery from diagnosing the real 404.
    location ^~ /assets/ {
        # Compress hashed bundles independently of the JSON API settings.
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_types text/css application/javascript image/svg+xml;
        expires max;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
