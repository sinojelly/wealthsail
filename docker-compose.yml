# WealthSail MVP runtime topology.
# A TLS reverse proxy terminates HTTPS in front of 127.0.0.1:8080. The API is
# reachable only from the private Compose network; API/Worker secrets are read
# from different, git-ignored files under deployment/env/.

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: wealthsail-backend:latest
    restart: unless-stopped
    env_file:
      - ${API_ENV_FILE:-deployment/env/api.env}
    environment:
      APP_ENV: production
      AUTH_DEV_MODE: "false"
      # Explicitly erase development defaults and Worker authority.
      WORKER_DATABASE_URL: ""
      MODEL_API_KEY: ""
      WECOM_CORP_SECRET: ""
      WECOM_BOT_SECRET: ""
    expose:
      - "8000"
    volumes:
      - avatar_data:/app/backend/static/avatars
    networks:
      - wealthsail
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: wealthsail-backend:latest
    restart: unless-stopped
    command: ["python", "-m", "backend.worker"]
    env_file:
      - ${WORKER_ENV_FILE:-deployment/env/worker.env}
    environment:
      APP_ENV: production
      AUTH_DEV_MODE: "false"
      # Worker cannot mint/validate browser sessions and has no API DSN.
      DATABASE_URL: ""
      JWT_SECRET: ""
      REFRESH_TOKEN_HMAC_KEY: ""
      PASSWORD_RESET_HMAC_KEY: ""
      BINDING_HMAC_KEY: ""
      WECOM_CALLBACK_TOKEN: ""
      WECOM_CALLBACK_AES_KEY: ""
    depends_on:
      api:
        condition: service_healthy
    networks:
      - wealthsail

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    image: wealthsail-frontend:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api
    networks:
      - wealthsail

volumes:
  avatar_data:

networks:
  wealthsail:
    driver: bridge
