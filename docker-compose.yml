# WealthSail MVP runtime topology.
# A TLS reverse proxy terminates HTTPS in front of 127.0.0.1:8080. The API is
# reachable only from the private Compose network; API/Worker secrets are read
# from different, git-ignored files under deployment/env/.

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: wealthsail-backend:latest
    restart: unless-stopped
    env_file:
      - ${API_ENV_FILE:-deployment/env/api.env}
    environment:
      APP_ENV: production
      AUTH_DEV_MODE: "false"
      # Explicitly erase development defaults and Worker authority.
      WORKER_DATABASE_URL: ""
      MODEL_API_KEY: ""
      WECOM_CORP_SECRET: ""
      WECOM_BOT_SECRET: ""
    expose:
      - "8000"
    depends_on:
      codex-runner:
        condition: service_healthy
    volumes:
      - avatar_data:/app/backend/static/avatars
    networks:
      - wealthsail
      - codex
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: wealthsail-backend:latest
    restart: unless-stopped
    command: ["python", "-m", "backend.worker"]
    env_file:
      - ${WORKER_ENV_FILE:-deployment/env/worker.env}
    environment:
      APP_ENV: production
      AUTH_DEV_MODE: "false"
      # Worker cannot mint/validate browser sessions and has no API DSN.
      DATABASE_URL: ""
      JWT_SECRET: ""
      REFRESH_TOKEN_HMAC_KEY: ""
      PASSWORD_RESET_HMAC_KEY: ""
      BINDING_HMAC_KEY: ""
      WECOM_CALLBACK_TOKEN: ""
      WECOM_CALLBACK_AES_KEY: ""
      MODEL_API_KEY: ""
      OPENAI_API_KEY: ""
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - research_audit_data:/app/data/research-audit
    networks:
      - wealthsail
      - codex
    # The shared image's HTTP healthcheck belongs to the API process.
    healthcheck:
      disable: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Only this process holds the refreshable Codex login. It has no database,
  # browser-session or messaging credentials and no published host port.
  codex-runner:
    image: wealthsail-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "backend.codex_runner"]
    env_file:
      - ${CODEX_ENV_FILE:-deployment/env/codex.env}
    environment:
      CODEX_HOME: /home/appuser/.codex
      CODEX_PATH: /usr/local/bin/codex
    volumes:
      - codex_auth:/home/appuser/.codex
    networks:
      - codex
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # One-shot device login/status tool. It shares only the Codex auth volume;
  # no env_file or application credentials are injected.
  codex-auth:
    image: wealthsail-backend:latest
    profiles: [tools]
    entrypoint: ["codex", "-c", 'cli_auth_credentials_store="file"']
    command: ["login", "status"]
    environment:
      CODEX_HOME: /home/appuser/.codex
      CODEX_PATH: /usr/local/bin/codex
    volumes:
      - codex_auth:/home/appuser/.codex
    networks:
      - codex
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"
    stdin_open: true
    tty: true
    healthcheck:
      disable: true

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    image: wealthsail-frontend:latest
    restart: unless-stopped
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      - api
    networks:
      - wealthsail

volumes:
  avatar_data:
  codex_auth:
  research_audit_data:

networks:
  wealthsail:
    driver: bridge
  codex:
    driver: bridge
